# KomgaTV 의존성 버전 카탈로그 (2026-10-31 기준 최신 안정판)

[versions]
# 빌드 도구 — AGP 9는 Kotlin을 내장한다. KGP는 build-logic 의존성으로 최신 안정판을 쓴다.
agp = "9.5.0"
kotlin = "2.4.21"
ksp = "2.3.13"

# Compose / TV
compose-bom = "2026.09.00"
tv-material = "1.1.0"
activity-compose = "1.13.0"
navigation-compose = "2.10.2"
lifecycle = "2.11.0"

# Komga 클라이언트 (Ktor 기반, MIT) — 엔진은 OkHttp
komga-client = "0.11.0"
ktor = "3.6.1"
okhttp = "5.5.1"
kotlinx-coroutines = "1.11.0"
kotlinx-datetime = "0.8.0"

# 이미지
coil = "3.6.3"
mlkit-text-recognition = "16.0.1"
mlkit-translate = "17.0.3"
androidx-test-runner = "1.7.0"
androidx-test-ext-junit = "1.3.0"

# DI
hilt = "2.60.1"
hilt-androidx = "1.4.0"

# 저장소
datastore = "1.3.0"

# 기타
androidx-core = "1.19.1"
timber = "5.0.1"

# 테스트
junit = "4.13.2"

[libraries]
# Compose
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "compose-bom" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-foundation = { group = "androidx.compose.foundation", name = "foundation" }
tv-material = { group = "androidx.tv", name = "tv-material", version.ref = "tv-material" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activity-compose" }
navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigation-compose" }
lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }

# 네트워크
komga-client = { group = "io.github.snd-r", name = "komga-client", version.ref = "komga-client" }
ktor-client-okhttp = { group = "io.ktor", name = "ktor-client-okhttp", version.ref = "ktor" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
okhttp-logging = { group = "com.squareup.okhttp3", name = "logging-interceptor", version.ref = "okhttp" }
okhttp-mockwebserver = { group = "com.squareup.okhttp3", name = "mockwebserver", version.ref = "okhttp" }
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }
kotlinx-datetime = { group = "org.jetbrains.kotlinx", name = "kotlinx-datetime", version.ref = "kotlinx-datetime" }

# 이미지
coil-compose = { group = "io.coil-kt.coil3", name = "coil-compose", version.ref = "coil" }
mlkit-text-recognition-japanese = { group = "com.google.mlkit", name = "text-recognition-japanese", version.ref = "mlkit-text-recognition" }
mlkit-translate = { group = "com.google.mlkit", name = "translate", version.ref = "mlkit-translate" }
androidx-test-runner = { group = "androidx.test", name = "runner", version.ref = "androidx-test-runner" }
androidx-test-ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidx-test-ext-junit" }
coil-network-okhttp = { group = "io.coil-kt.coil3", name = "coil-network-okhttp", version.ref = "coil" }

# DI
hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-android-compiler", version.ref = "hilt" }
hilt-lifecycle-viewmodel-compose = { group = "androidx.hilt", name = "hilt-lifecycle-viewmodel-compose", version.ref = "hilt-androidx" }

# 저장소
datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }

# 기타
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "androidx-core" }
timber = { group = "com.jakewharton.timber", name = "timber", version.ref = "timber" }
junit = { group = "junit", name = "junit", version.ref = "junit" }

# build-logic 전용 (컨벤션 플러그인 클래스패스)
android-gradlePlugin = { group = "com.android.tools.build", name = "gradle", version.ref = "agp" }
kotlin-gradlePlugin = { group = "org.jetbrains.kotlin", name = "kotlin-gradle-plugin", version.ref = "kotlin" }
compose-gradlePlugin = { group = "org.jetbrains.kotlin", name = "compose-compiler-gradle-plugin", version.ref = "kotlin" }
ksp-gradlePlugin = { group = "com.google.devtools.ksp", name = "com.google.devtools.ksp.gradle.plugin", version.ref = "ksp" }
hilt-gradlePlugin = { group = "com.google.dagger", name = "hilt-android-gradle-plugin", version.ref = "hilt" }

[plugins]
komgatv-android-application = { id = "komgatv.android.application" }
komgatv-android-library = { id = "komgatv.android.library" }
komgatv-android-compose = { id = "komgatv.android.compose" }
komgatv-android-feature = { id = "komgatv.android.feature" }
komgatv-hilt = { id = "komgatv.hilt" }
